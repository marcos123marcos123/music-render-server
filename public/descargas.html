<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>⬇️ Descargas</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:#0b0f19; color:#e6edf3; min-height:100vh; padding:20px; }
  .container { max-width:900px; margin:0 auto; }
  h1 { margin:0 0 4px; font-size:24px; }
  .subtitle { color:#8b949e; margin-bottom:20px; font-size:14px; }
  .back { display:inline-block; margin-bottom:16px; color:#58a6ff; text-decoration:none; font-size:14px; }
  .card { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:16px; margin-bottom:16px; }
  .card h2 { margin:0 0 12px; font-size:12px; text-transform:uppercase; color:#8b949e; letter-spacing:.05em; }
  .row { display:flex; gap:8px; align-items:center; }
  input { background:#0d1117; border:1px solid #30363d; color:#e6edf3; padding:10px 12px;
          border-radius:8px; font-size:14px; flex:1; }
  button { background:#21262d; color:#e6edf3; border:1px solid #30363d; padding:9px 14px;
           border-radius:8px; cursor:pointer; font-size:13px; }
  button:hover { background:#30363d; }
  button.primary { background:#238636; border-color:#2ea043; }
  button.danger { background:#a6231f; border-color:#cf222e; }
  .item { display:flex; gap:12px; padding:10px 0; border-bottom:1px solid #21262d; align-items:center; }
  .item:last-child { border-bottom:none; }
  .item img { width:80px; height:45px; object-fit:cover; border-radius:6px; flex-shrink:0; background:#21262d; }
  .item .info { flex:1; min-width:0; }
  .item .title { font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item .vid { font-size:11px; color:#8b949e; font-family:monospace; }
  .empty { color:#8b949e; font-size:13px; text-align:center; padding:20px; }
</style>
</head>
<body>
<div class="container">
  <a href="/admin" class="back">← Volver al admin</a>
  <h1>⬇️ Descargas</h1>
  <div class="subtitle">Buscador y gestor de descargas</div>

  <div class="card">
    <h2>🔍 Buscar en YouTube</h2>
    <div class="row">
      <input id="searchInput" placeholder="Escribe para buscar…"
             onkeydown="if(event.key==='Enter'){event.preventDefault();doSearch();}">
      <button class="primary" onclick="doSearch()">Buscar</button>
    </div>
    <div id="searchResults" style="margin-top:8px"></div>
  </div>

  <div class="card">
    <h2>📋 Cola de descargas</h2>
    <div id="downloads"><div class="empty">Cargando…</div></div>
  </div>
</div>

<script>
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  const el = document.getElementById('searchResults');
  el.innerHTML = '<div class="empty">Buscando…</div>';
  try {
    const r = await fetch('/api/search?q=' + encodeURIComponent(q));
    const items = await r.json();
    if (!items.length) { el.innerHTML = '<div class="empty">Sin resultados</div>'; return; }
    el.innerHTML = items.slice(0, 12).map(it => {
      const vid = it.video_id || it.videoId || '';
      const ttl = it.title || '';
      return `
        <div class="item">
          <img src="https://img.youtube.com/vi/${esc(vid)}/mqdefault.jpg" onerror="this.style.visibility='hidden'">
          <div class="info">
            <div class="title">${esc(ttl)}</div>
            <div class="vid">${esc(vid)}</div>
          </div>
          <div class="actions">
            <button class="primary" onclick="addDownload('${esc(vid)}','${esc(ttl).replace(/'/g,"&#39;")}')">⬇ Descargar</button>
          </div>
        </div>`;
    }).join('');
  } catch(e) { el.innerHTML = '<div class="empty">Error</div>'; }
}
async function addDownload(video_id, title) {
  try {
    await fetch('/api/download/add', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({video_id, title})
    });
    alert('Añadido: ' + (title || video_id));
    loadDownloads();
  } catch(e) { alert('Error: ' + e.message); }
}
async function loadDownloads() {
  const el = document.getElementById('downloads');
  try {
    const r = await fetch('/api/download/list');
    if (!r.ok) { el.innerHTML = '<div class="empty">Descargas no disponibles todavía</div>'; return; }
    const data = await r.json();
    if (!data.length) { el.innerHTML = '<div class="empty">Cola vacía</div>'; return; }
    el.innerHTML = data.map(item => `
      <div class="item">
        <img src="https://img.youtube.com/vi/${esc(item.video_id)}/mqdefault.jpg" onerror="this.style.visibility='hidden'">
        <div class="info">
          <div class="title">${esc(item.title || item.video_id)}</div>
          <div class="vid">${esc(item.status || 'pendiente')}</div>
        </div>
        <div class="actions">
          <button class="danger" onclick="removeDownload('${esc(item.video_id)}')">✕</button>
        </div>
      </div>`).join('');
  } catch(e) { el.innerHTML = '<div class="empty">Descargas no disponibles todavía</div>'; }
}
async function removeDownload(video_id) {
  try {
    await fetch('/api/download/remove', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({video_id})
    });
    loadDownloads();
  } catch(e) { alert('Error'); }
}
loadDownloads();
</script>
</body>
</html>
