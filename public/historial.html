<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>📜 Historial</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:#0b0f19; color:#e6edf3; min-height:100vh; padding:20px; }
  .container { max-width:900px; margin:0 auto; }
  h1 { margin:0 0 4px; font-size:24px; }
  .subtitle { color:#8b949e; margin-bottom:20px; font-size:14px; }
  .back { display:inline-block; margin-bottom:16px; color:#58a6ff; text-decoration:none; font-size:14px; }
  .card { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:16px; margin-bottom:16px; }
  .card h2 { margin:0 0 12px; font-size:12px; text-transform:uppercase; color:#8b949e; letter-spacing:.05em; }
  .item { display:flex; gap:12px; padding:10px 0; border-bottom:1px solid #21262d; align-items:center; }
  .item:last-child { border-bottom:none; }
  .item img { width:80px; height:45px; object-fit:cover; border-radius:6px; flex-shrink:0; background:#21262d; }
  .item .info { flex:1; min-width:0; }
  .item .title { font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item .vid { font-size:11px; color:#8b949e; font-family:monospace; }
  .item .actions { display:flex; gap:6px; flex-shrink:0; }
  button { background:#21262d; color:#e6edf3; border:1px solid #30363d; padding:8px 12px;
           border-radius:6px; cursor:pointer; font-size:12px; }
  button:hover { background:#30363d; }
  button.primary { background:#238636; border-color:#2ea043; }
  button.danger { background:#a6231f; border-color:#cf222e; }
  .empty { color:#8b949e; font-size:13px; text-align:center; padding:20px; }
</style>
</head>
<body>
<div class="container">
  <a href="/admin" class="back">← Volver al admin</a>
  <h1>📜 Historial</h1>
  <div class="subtitle">Canciones reproducidas</div>

  <div class="card">
    <h2>Historial</h2>
    <div id="history"><div class="empty">Cargando…</div></div>
  </div>
</div>

<script>
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function loadHistory() {
  const el = document.getElementById('history');
  try {
    const r = await fetch('/api/history');
    if (!r.ok) { el.innerHTML = '<div class="empty">Historial no disponible todavía</div>'; return; }
    const data = await r.json();
    if (!data.length) { el.innerHTML = '<div class="empty">Sin historial</div>'; return; }
    el.innerHTML = data.map(item => `
      <div class="item">
        <img src="https://img.youtube.com/vi/${esc(item.video_id)}/mqdefault.jpg" onerror="this.style.visibility='hidden'">
        <div class="info">
          <div class="title">${esc(item.title || item.video_id)}</div>
          <div class="vid">${esc(item.video_id)} · ${esc(item.ts || '')}</div>
        </div>
        <div class="actions">
          <button class="primary" onclick="sendToDownload('${esc(item.video_id)}','${esc(item.title || '').replace(/'/g,"&#39;")}')">⬇</button>
        </div>
      </div>`).join('');
  } catch(e) {
    el.innerHTML = '<div class="empty">Historial no disponible todavía</div>';
  }
}
async function sendToDownload(video_id, title) {
  try {
    await fetch('/api/download/add', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({video_id, title})
    });
    alert('Añadido a descargas: ' + (title || video_id));
  } catch(e) { alert('Error: ' + e.message); }
}
loadHistory();
</script>
</body>
</html>
