<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚙ Configuración — Acceso</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:#0b0f19; color:#e6edf3; min-height:100vh;
         display:flex; align-items:center; justify-content:center; padding:20px; }
  .container { max-width:400px; width:100%; }
  h1 { margin:0 0 8px; font-size:22px; text-align:center; }
  .subtitle { color:#8b949e; margin-bottom:24px; font-size:13px; text-align:center; }
  .card { background:#161b22; border:1px solid #30363d; border-radius:12px;
          padding:24px; }
  label { display:block; font-size:12px; color:#8b949e; margin-bottom:6px;
          text-transform:uppercase; letter-spacing:.05em; }
  input { background:#0d1117; border:1px solid #30363d; color:#e6edf3;
          padding:12px 14px; border-radius:8px; font-size:15px;
          width:100%; margin-bottom:14px; }
  input:focus { outline:none; border-color:#58a6ff; }
  button { background:#238636; color:#fff; border:1px solid #2ea043;
           padding:12px 20px; border-radius:8px; cursor:pointer;
           font-size:15px; font-weight:600; width:100%; transition:all .15s; }
  button:hover { background:#2ea043; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .status { min-height:22px; font-size:13px; margin-top:12px; text-align:center; }
  .back { text-align:center; margin-top:16px; font-size:13px; }
  .back a { color:#58a6ff; text-decoration:none; }
  .lock { font-size:40px; text-align:center; margin-bottom:8px; }
</style>
<script src="/ngrok-skip.js"></script>
</head>
<body>
<div class="container">
  <div class="lock">🔒</div>
  <h1>Configuración</h1>
  <div class="subtitle">Acceso restringido al administrador</div>

  <div class="card">
    <label for="user">Usuario</label>
    <input id="user" type="text" autocomplete="username" autofocus>

    <label for="pass">Contraseña</label>
    <input id="pass" type="password" autocomplete="current-password">

    <button type="button" id="loginBtn" onclick="doLogin()">Entrar</button>
    <div class="status" id="status"></div>
  </div>

  <div class="back"><a href="/">← Volver al inicio</a></div>
</div>

<script>
async function doLogin() {
  const btn = document.getElementById('loginBtn');
  const status = document.getElementById('status');
  const user = document.getElementById('user').value.trim();
  const pass = document.getElementById('pass').value;

  if (!user || !pass) {
    status.innerHTML = '<span style="color:#f85149">⚠ Rellena ambos campos</span>';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Comprobando…';
  status.textContent = '';

  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ username: user, password: pass }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Error de login');

    localStorage.setItem('ms_admin_token', data.token);
    status.innerHTML = '<span style="color:#3fb950">✓ Correcto. Entrando…</span>';
    setTimeout(() => { window.location.href = '/admin'; }, 600);
  } catch (e) {
    status.innerHTML = '<span style="color:#f85149">✕ ' + e.message + '</span>';
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}

// Enter para enviar
document.getElementById('user').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('pass').focus(); });
document.getElementById('pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
